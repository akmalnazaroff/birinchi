<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Challenge</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f7f5;
            color: #171717;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
        }

        button {
            border: none;
            background: #171717;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #777;
            font-size: 17px;
            margin-bottom: 40px;
        }

        .challenges {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            border: 1px solid #e8e8e8;
            border-radius: 16px;
            padding: 24px;
            cursor: pointer;
            transition: 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
        }

        .card h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .deadline {
            color: #777;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 8px;
            background: #eeeeee;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress {
            height: 100%;
            background: #171717;
        }

        .progress-text {
            font-size: 14px;
            color: #777;
        }

        .participants {
            margin-top: 20px;
            font-size: 14px;
            color: #555;
        }

        /* DETAIL PAGE */

        .back-button {
            background: transparent;
            color: #555;
            padding: 0;
            margin-bottom: 35px;
        }

        .detail-title {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .goal {
            color: #777;
            font-size: 18px;
            margin-bottom: 35px;
        }

        .detail-card {
            background: white;
            border: 1px solid #e8e8e8;
            border-radius: 18px;
            padding: 30px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .big-progress {
            height: 14px;
            background: #eeeeee;
            border-radius: 20px;
            overflow: hidden;
            margin: 20px 0 12px;
        }

        .big-progress .progress {
            background: #171717;
        }

        .progress-number {
            font-size: 28px;
            font-weight: 700;
        }

        .update-button {
            margin-top: 20px;
        }

        .participant {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .participant:last-child {
            border-bottom: none;
        }

        .finish-button {
            background: white;
            color: #171717;
            border: 1px solid #ddd;
            width: 100%;
            margin-top: 10px;
        }

        /* MODAL */

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal {
            background: white;
            width: 100%;
            max-width: 500px;
            border-radius: 18px;
            padding: 30px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-header h2 {
            font-size: 24px;
        }

        .close {
            background: transparent;
            color: #777;
            font-size: 25px;
            padding: 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 15px;
        }

        .create-button {
            width: 100%;
            margin-top: 10px;
        }

        @media (max-width: 700px) {

            .challenges {
                grid-template-columns: 1fr;
            }

            h1,
            .detail-title {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- HOME -->

    <div id="homePage">

        <header>
            <div class="logo">Challenge</div>

            <button onclick="openModal()">
                + New Challenge
            </button>
        </header>

        <main>

            <h1>My Challenges</h1>

            <p class="subtitle">
                Maqsadingni belgilagin. Boshqalar bilan birga erish.
            </p>

            <div class="challenges" id="challengeList"></div>

        </main>

    </div>


    <!-- DETAIL -->

    <div id="detailPage" style="display:none;">

        <button class="back-button" onclick="showHome()">
            ← Back
        </button>

        <div id="detailContent"></div>

    </div>

</div>


<!-- CREATE MODAL -->

<div class="modal-overlay" id="modal">

    <div class="modal">

        <div class="modal-header">

            <h2>Create Challenge</h2>

            <button class="close" onclick="closeModal()">
                ×
            </button>

        </div>

        <form onsubmit="createChallenge(event)">

            <div class="form-group">

                <label>Challenge name</label>

                <input
                    type="text"
                    id="challengeName"
                    placeholder="Masalan: IELTS 7.5"
                    required
                >

            </div>


            <div class="form-group">

                <label>Goal</label>

                <input
                    type="text"
                    id="challengeGoal"
                    placeholder="Masalan: IELTS'dan 7.5 olish"
                    required
                >

            </div>


            <div class="form-group">

                <label>Deadline</label>

                <input
                    type="date"
                    id="challengeDeadline"
                    required
                >

            </div>


            <div class="form-group">

                <label>Who can join?</label>

                <select id="challengeAccess">

                    <option value="private">
                        Only me
                    </option>

                    <option value="invite">
                        Invite people
                    </option>

                    <option value="link">
                        Anyone with link
                    </option>

                </select>

            </div>


            <button class="create-button" type="submit">
                Create Challenge
            </button>

        </form>

    </div>

</div>


<!-- UPDATE PROGRESS MODAL -->

<div class="modal-overlay" id="progressModal">

    <div class="modal">

        <div class="modal-header">

            <h2>Update Progress</h2>

            <button class="close" onclick="closeProgressModal()">
                ×
            </button>

        </div>

        <form onsubmit="updateProgress(event)">

            <div class="form-group">

                <label>Your progress (%)</label>

                <input
                    type="number"
                    id="progressInput"
                    min="0"
                    max="100"
                    placeholder="0 - 100"
                    required
                >

            </div>

            <button class="create-button" type="submit">
                Save Progress
            </button>

        </form>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://gvrvpqzfbndjpawykbsj.supabase.co";
const SUPABASE_KEY = "sb_publishable__fl2XUvFgmT2-lVbb_zLOw_fAjGtTqk";

const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);
</script>
<script>

let challenges = [];
let selectedChallengeId = null;


// =========================
// LOAD CHALLENGES
// =========================

async function loadChallenges() {

    const { data, error } = await supabase
        .from("challenges")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        console.error("Error loading challenges:", error);
        alert("Challenge'larni yuklashda xatolik yuz berdi.");
        return;
    }

    challenges = data || [];

    renderChallenges();
}


// =========================
// RENDER CHALLENGES
// =========================

function renderChallenges() {

    const list = document.getElementById("challengeList");

    list.innerHTML = "";

    if (challenges.length === 0) {

        list.innerHTML = `
            <p style="color:#777;">
                Hozircha challenge yo‘q.
            </p>
        `;

        return;
    }


    challenges.forEach(challenge => {

        const card = document.createElement("div");

        card.className = "card";

        card.onclick = () => showDetail(challenge.id);


        card.innerHTML = `

            <h2>
                ${escapeHtml(challenge.title)}
            </h2>

            <div class="deadline">
                Deadline: ${formatDate(challenge.deadline)}
            </div>

            <div class="progress-bar">

                <div
                    class="progress"
                    style="width:${challenge.progress || 0}%"
                ></div>

            </div>

            <div class="progress-text">
                ${challenge.progress || 0}% completed
            </div>

            <div class="participants">
                👥 ${challenge.participants || 1} participants
            </div>

        `;

        list.appendChild(card);

    });
}


// =========================
// SHOW DETAIL
// =========================

function showDetail(id) {

    selectedChallengeId = id;

    const challenge = challenges.find(
        item => item.id === id
    );

    if (!challenge) return;


    document.getElementById("homePage").style.display = "none";

    document.getElementById("detailPage").style.display = "block";


    const content = document.getElementById("detailContent");


    content.innerHTML = `

        <h1 class="detail-title">
            ${escapeHtml(challenge.title)}
        </h1>

        <p class="goal">
            ${escapeHtml(challenge.description || "")}
        </p>


        <div class="detail-card">

            <div class="section-title">
                Progress
            </div>

            <div class="big-progress">

                <div
                    class="progress"
                    style="width:${challenge.progress || 0}%"
                ></div>

            </div>

            <div class="progress-number">
                ${challenge.progress || 0}%
            </div>


            <button
                class="update-button"
                onclick="openProgressModal()"
            >
                Update Progress
            </button>

        </div>


        <div class="detail-card">

            <div class="section-title">
                Challenge information
            </div>

            <div class="participant">

                <span>Deadline</span>

                <strong>
                    ${formatDate(challenge.deadline)}
                </strong>

            </div>


            <div class="participant">

                <span>Participants</span>

                <strong>
                    ${challenge.participants || 1}
                </strong>

            </div>

        </div>

    `;
}


// =========================
// BACK HOME
// =========================

function showHome() {

    document.getElementById("detailPage").style.display = "none";

    document.getElementById("homePage").style.display = "block";

    selectedChallengeId = null;

    loadChallenges();
}


// =========================
// CREATE CHALLENGE MODAL
// =========================

function openModal() {

    document.getElementById("modal").style.display = "flex";

}


function closeModal() {

    document.getElementById("modal").style.display = "none";

}


// =========================
// CREATE CHALLENGE
// =========================

async function createChallenge(event) {

    event.preventDefault();


    const title =
        document.getElementById("challengeName").value.trim();

    const description =
        document.getElementById("challengeGoal").value.trim();

    const deadline =
        document.getElementById("challengeDeadline").value;

    const access =
        document.getElementById("challengeAccess").value;


    const { data, error } = await supabase

        .from("challenges")

        .insert({

            title: title,

            description: description,

            deadline: deadline,

            progress: 0,

            participants: 1

        })

        .select();


    if (error) {

        console.error("Error creating challenge:", error);

        alert(
            "Challenge yaratishda xatolik:\n" +
            error.message
        );

        return;
    }


    console.log("Created:", data);

    console.log("Access:", access);


    closeModal();


    document.querySelector("#modal form").reset();


    await loadChallenges();

}


// =========================
// PROGRESS MODAL
// =========================

function openProgressModal() {

    const challenge = challenges.find(
        item => item.id === selectedChallengeId
    );

    if (!challenge) return;


    document.getElementById("progressInput").value =
        challenge.progress || 0;


    document.getElementById("progressModal").style.display = "flex";

}


function closeProgressModal() {

    document.getElementById("progressModal").style.display = "none";

}


// =========================
// UPDATE PROGRESS
// =========================

async function updateProgress(event) {

    event.preventDefault();


    if (!selectedChallengeId) return;


    const progress = Number(
        document.getElementById("progressInput").value
    );


    if (progress < 0 || progress > 100) {

        alert("Progress 0 dan 100 gacha bo‘lishi kerak.");

        return;
    }


    const { error } = await supabase

        .from("challenges")

        .update({

            progress: progress

        })

        .eq("id", selectedChallengeId);


    if (error) {

        console.error("Error updating progress:", error);

        alert(
            "Progressni saqlashda xatolik:\n" +
            error.message
        );

        return;
    }


    closeProgressModal();


    await loadChallenges();


    showDetail(selectedChallengeId);

}


// =========================
// HELPERS
// =========================

function formatDate(date) {

    if (!date) return "—";


    const parts = date.split("-");


    if (parts.length === 3) {

        return `${parts[2]}.${parts[1]}.${parts[0]}`;

    }


    return date;
}


function escapeHtml(text) {

    if (!text) return "";


    return text

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");

}


// =========================
// START APP
// =========================

loadChallenges();

</script>
